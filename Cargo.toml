[package]
name = "roadmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
default = ["desktop"]
desktop = []

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
